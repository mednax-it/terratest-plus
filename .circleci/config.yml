version: 2.1


executors:
  build-container:
    docker:
      - image: mednax.azurecr.io/sdbi-iac-docker-image:5.2.0
        auth:
          username: $REPO_USER
          password: $REPO_PW
jobs:
  Test Framework:
    executor: build-container
    description: Builds an Adhoc Testing Env and destroys it at the end. For testing the Terratest Framework
    steps:
      - checkout
      - run:
          command: |
            source scripts/setup_for_deployment.sh
            go test -count=1 -v
          no_output_timeout: 1h


workflows:

  Testing TerratestPlus:
    jobs:
    - Test Framework:
        name: Go Tests
        context:
          - mednax-global
          - github-machine-user
